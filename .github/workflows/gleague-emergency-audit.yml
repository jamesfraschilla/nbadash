name: G League emergency live-feed audit 2052600033
on:
  push:
    branches: ["audit/gleague-2052600033"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm_a:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Record initial cloud sample
        env:
          AUDIT_OUTPUT: output/arm-a
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/gleague-feed-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gleague-2052600033-arm-a-${{ github.run_id }}
          path: output/arm-a/
          retention-days: 14
          if-no-files-found: warn
      - name: Hold independently until 12.10 p.m. Eastern
        run: |
          python - <<'PYARM'
          import datetime, time
          target=datetime.datetime(2026,11,11,17,10,tzinfo=datetime.timezone.utc).timestamp()
          print('Armed for 2026-11-11 17:10 UTC',flush=True)
          while time.time()<target: time.sleep(min(60,max(0,target-time.time())))
          PYARM
  arm_b:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Record initial cloud sample
        env:
          AUDIT_OUTPUT: output/arm-b
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/gleague-feed-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gleague-2052600033-arm-b-${{ github.run_id }}
          path: output/arm-b/
          retention-days: 14
          if-no-files-found: warn
      - name: Hold independently until 12.10 p.m. Eastern
        run: |
          python - <<'PYARM'
          import datetime, time
          target=datetime.datetime(2026,11,11,17,10,tzinfo=datetime.timezone.utc).timestamp()
          print('Armed for 2026-11-11 17:10 UTC',flush=True)
          while time.time()<target: time.sleep(min(60,max(0,target-time.time())))
          PYARM
  collect_a:
    needs: arm_a
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Collect checkpoint 01
        if: always()
        timeout-minutes: 12
        env:
          AUDIT_OUTPUT: output/a-01
        run: |
          end=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            python scripts/gleague-feed-audit.py || true
            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -lt 60 ]; then sleep $((60 - elapsed)); fi
          done
      - name: Save checkpoint 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gleague-2052600033-a-01-${{ github.run_id }}
          path: output/a-01/
          retention-days: 14
          if-no-files-found: warn
