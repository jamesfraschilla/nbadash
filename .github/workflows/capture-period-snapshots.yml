name: Capture Period Snapshots

on:
  schedule:
    - cron: "*/5 16-23,0-9 * * *"
    - cron: "0 10,12,14 * * *"
    - cron: "0 11,13,15 * * *"
  workflow_dispatch:

jobs:
  capture:
    env:
      NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Capture snapshots
        id: snapshots
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_WINDOW_MINUTES: 3
        run: node scripts/capture-period-snapshots.js
      - name: Check dashboard availability and reconcile recent tracked finals
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-dashboard-health.mjs
          if [[ "$(TZ=America/New_York date +%H)" == "08" ]]; then
            node scripts/check-dashboard-health.mjs --reconcile
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dashboard-health-${{ github.run_id }}
          path: output/dashboard-health/
          retention-days: 7
          if-no-files-found: ignore
      - name: Report failed snapshot reconciliation
        if: steps.snapshots.outcome == 'failure'
        run: exit 1
