name: Officiating Daily Maintenance

on:
  schedule:
    - cron: "5 9,10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officiating-daily-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh stale current-season rollups and audit integrity
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-officiating-daily-maintenance.mjs
