name: Scan Referee Assignments

on:
  schedule:
    # Backup verifier; authoritative 9:03 Eastern dispatch is Supabase pg_cron.
    - cron: "8 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referee-assignment-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and report today's published referee crews
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: node scripts/check-referee-assignments.mjs
