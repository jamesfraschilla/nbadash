name: Deploy Supabase

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "scripts/supabase-deployment-manifest.mjs"
      - "scripts/verify-supabase-production.mjs"
  workflow_dispatch:
    inputs:
      apply_note_sharing:
        description: Apply the Playcall note-sharing function migration (preserves existing note data)
        type: boolean
        default: false
      apply_reliability_jobs:
        description: Apply isolated referee and analysis reconciliation schedules
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run supabase:manifest:check
      - run: npm run test:edge
      - run: npm run typecheck
      - name: Require deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Apply Playcall note sharing and verify saved content is unchanged
        if: github.event_name == 'workflow_dispatch' && inputs.apply_note_sharing
        run: |
          jq -n --rawfile query supabase/playcall_note_sharing.sql '{query: $query}' |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
      - name: Attest database after successful note-sharing migration
        if: github.event_name == 'workflow_dispatch' && inputs.apply_note_sharing
        run: node scripts/verify-supabase-production.mjs --record-database
      - name: Apply reliability schedules
        if: github.event_name == 'workflow_dispatch' && inputs.apply_reliability_jobs
        run: |
          for migration in supabase/reliability_jobs.sql supabase/officiating_overview_refresh.sql; do
          jq -n --rawfile query "$migration" '{query: $query}' |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          done
          node scripts/verify-supabase-production.mjs --record-database
      - name: Refuse deployment when database scripts are not attested in production
        run: npm run supabase:production:check-database
      - name: Deploy every repository Edge Function
        run: |
          node -e 'for (const row of require("./supabase/deployment-manifest.json").edgeFunctions) console.log(row.name)' |
          while read -r fn; do
            for attempt in 1 2 3; do
              if npx -y supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              echo "Retrying $fn after deployment attempt $attempt failed."
              sleep "$((attempt * 5))"
            done
          done
      - run: npm run supabase:production:record-edge
      - run: npm run supabase:production:check
