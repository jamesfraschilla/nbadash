name: Wizards Pacers live API audit 20261111
on:
  push:
    branches: ["audit/wizards-live-20261111"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector_a:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Collect checkpoint 01
        if: always()
        timeout-minutes: 12
        env:
          AUDIT_OUTPUT: output/wizards-a-01
        run: |
          end=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            python scripts/wizards-live-feed-audit.py || true
            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -lt 60 ]; then sleep $((60 - elapsed)); fi
          done
      - name: Save checkpoint 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizards-0022600217-a-01-${{ github.run_id }}
          path: output/wizards-a-01/
          retention-days: 14
          if-no-files-found: warn
