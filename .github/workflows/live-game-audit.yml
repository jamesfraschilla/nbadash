name: Live Game Audit

on:
  # Arm explicitly ahead of tip. A running timer avoids delayed cron starts.
  workflow_dispatch:
    inputs:
      game_id:
        description: Approved audit game
        required: true
        type: choice
        options: ["0022600112", "0022600117", "0022600118", "0022600119"]
      dry_run:
        description: One read-only capture, no analysis generation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: live-audit-${{ inputs.game_id }}
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate shared analysis access before waiting
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const url = process.env.SUPABASE_URL;
          if (!key || !url) throw new Error('Audit credentials are missing.');
          const response = await fetch(`${url}/rest/v1/game_analysis_segments?select=game_id&limit=1`, {
            headers: { apikey: key, authorization: `Bearer ${key}` }, signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Shared analysis access failed (${response.status}).`);
          console.log('Shared analysis access verified.');
          JS
      - name: Arm bounded start timer
        env:
          GAME_ID: ${{ inputs.game_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { auditStartPlan } from './src/liveAuditGames.js';
          const plan = auditStartPlan(process.env.GAME_ID, Date.now(), process.env.DRY_RUN === 'true');
          console.log(`Armed ${plan.gameId}; collection starts ${new Date(plan.startsAt).toISOString()}`);
          while (Date.now() < plan.startsAt) {
            await new Promise(resolve => setTimeout(resolve, Math.min(60_000, plan.startsAt - Date.now())));
          }
          console.log('Start window reached.');
          JS

  audit:
    needs: arm
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GAME_ID: ${{ inputs.game_id }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate collector
        run: node --test src/liveAuditGames.test.js
      - name: Capture live feeds and prepare shared segment analyses
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if [ "$DRY_RUN" = true ]; then
            node scripts/live-game-audit.mjs --game-id="$GAME_ID" --dry-run
          else
            node scripts/live-game-audit.mjs --game-id="$GAME_ID"
          fi
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-${{ env.GAME_ID }}-${{ github.run_id }}
          path: output/live-audit/${{ env.GAME_ID }}/
          retention-days: 2
          if-no-files-found: error
      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ -f "output/live-audit/$GAME_ID/summary.json" ]; then
            echo '### Live audit summary' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "output/live-audit/$GAME_ID/summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
